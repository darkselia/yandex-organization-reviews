name: yandex-org-reviews

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
      && php artisan migrate --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    init: true
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  queue:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
      && php artisan queue:work --tries=3 --timeout=600"
    init: true
    depends_on:
      - api
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend-build:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /var/www/yandex-organization-reviews/frontend:/output
    command: >
      sh -c "npm ci
      && npm run build
      && rm -rf /output/*
      && cp -r dist/. /output/"

volumes:
  backend_vendor:
  frontend_node_modules: