name: yandex-reviews

services:
  api:
    build:
      context: ./backend
    command: >-
      sh -c "composer install --no-interaction --prefer-dist
      && php artisan serve --host=0.0.0.0 --port=8000"
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  queue:
    build:
      context: ./backend
    command: >-
      sh -c "composer install --no-interaction --prefer-dist
      && php artisan queue:work --tries=3"
    init: true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend:
    build:
      context: ./frontend
    command: >-
      sh -c "npm install --no-audit --no-fund
      && npm run dev -- --host=0.0.0.0"
    init: true
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  backend_vendor:
  frontend_node_modules:
